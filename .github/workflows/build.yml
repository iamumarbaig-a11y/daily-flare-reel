name: Build Daily Flare Reel

on:
  push:
    branches: [ main, kokoro-experimental ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate CTA overlay feature
        run: |
          python3 tools/integrate_cta.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/thedailyflare/reel/MainActivity.kt app/src/main/java/com/thedailyflare/reel/ReelEncoder.kt app/src/main/java/com/thedailyflare/reel/CtaOverlayRenderer.kt app/src/main/java/com/thedailyflare/reel/CtaOverlayActivity.kt app/src/debug/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Integrate CTA overlay editor and export rendering"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Gradle version
        run: gradle --version
      - name: Restore extracted APK background asset
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d baseline/daily_flare_background.jpg.b64 > app/src/main/res/drawable-nodpi/daily_flare_background.jpg
      - name: Download official Sherpa-ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-1.13.7.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
      - name: Build debug APK
        run: gradle --version && gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flare-reel-kokoro-experimental-cta-integrated
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
      - name: Publish APK to GitHub Release
        if: success() && github.ref == 'refs/heads/kokoro-experimental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          gh release create "kokoro-cta-${{ github.run_id }}" "$APK" --repo "${{ github.repository }}" --title "Daily Flare Reel CTA Overlay — build ${{ github.run_number }}" --notes "CTA overlay integration from kokoro-experimental commit ${{ github.sha }}."
